[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyman"
version = "0.1.0"
description = "Attempts to solve the traveling salesman problem."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2,<3",
]
authors = [
  { name = "Subho" },
]
keywords = ["tsp", "traveling-salesman", "graph", "optimization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
viz = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-image>=0.22",
  "pyvista>=0.44",
]

[project.scripts]
lazyman = "lazyman.cli:main"
lazyman-viz3d = "lazyman.viz3d:main"
lazyman-viz3d-demo = "lazyman.demo.demo_viz3d:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
