<svg viewBox="0 0 100 100" width="220" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .scene {
      animation: galaxySpin 8s linear infinite;
      transform-origin: 50px 50px;
    }

    .particle {
      animation: orbitMorph 8s ease-in-out infinite;
      transform-origin: 0 0;
    }

    .digit {
      animation: digitMorph 8s ease-in-out infinite;
      transform-origin: 0 0;
    }

    .blob {
      animation: blobMorph 8s ease-in-out infinite;
      transform-origin: 0 0;
    }

    .core {
      animation: corePulse 8s ease-in-out infinite;
      transform-origin: 50px 50px;
    }

    @keyframes galaxySpin {
      0% { transform: translate(50px, 50px) rotate(0deg); }
      18% { transform: translate(50px, 50px) rotate(0deg); }
      62% { transform: translate(50px, 50px) rotate(180deg); }
      82% { transform: translate(50px, 50px) rotate(235deg); }
      100% { transform: translate(50px, 50px) rotate(360deg); }
    }

    @keyframes orbitMorph {
      0% {
        transform: translate(var(--cx), var(--cy)) scale(var(--cscale));
      }
      22% {
        transform: translate(var(--sx), var(--sy)) scale(var(--sscale));
      }
      62% {
        transform: translate(var(--sx), var(--sy)) scale(var(--sscale));
      }
      82% {
        transform: translate(var(--cx), var(--cy)) scale(var(--rscale));
      }
      100% {
        transform: translate(var(--cx), var(--cy)) scale(var(--cscale));
      }
    }

    @keyframes digitMorph {
      0% { transform: scale(1); }
      62% { transform: scale(1); }
      74% { transform: scale(0.01); }
      88% { transform: scale(0.01); }
      100% { transform: scale(1); }
    }

    @keyframes blobMorph {
      0% { transform: scale(0.01); }
      62% { transform: scale(0.01); }
      74% { transform: scale(1); }
      88% { transform: scale(1); }
      100% { transform: scale(0.01); }
    }

    @keyframes corePulse {
      0% { transform: scale(1); }
      22% { transform: scale(0.28); }
      62% { transform: scale(0.28); }
      82% { transform: scale(0.55); }
      100% { transform: scale(1); }
    }
  </style>

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#16233a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="16" fill="url(#bg)"/>

  <g class="scene">
    <g class="particle" style="--cx:18px; --cy:-8px;  --sx:5px;  --sy:0px;  --cscale:0.55; --sscale:1.00; --rscale:0.75;">
      <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
      <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
    </g>
    <g class="particle" style="--cx:21px; --cy:-2px;  --sx:9px;  --sy:4px;  --cscale:0.62; --sscale:0.93; --rscale:0.80;">
      <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
      <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
    </g>
    <g class="particle" style="--cx:21px; --cy:5px;   --sx:11px; --sy:10px; --cscale:0.69; --sscale:0.84; --rscale:0.85;">
      <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
      <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
    </g>
    <g class="particle" style="--cx:17px; --cy:12px;  --sx:8px;  --sy:18px; --cscale:0.76; --sscale:0.74; --rscale:0.90;">
      <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
      <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
    </g>

    <g transform="rotate(90)">
      <g class="particle" style="--cx:18px; --cy:-8px;  --sx:5px;  --sy:0px;  --cscale:0.55; --sscale:1.00; --rscale:0.75;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:21px; --cy:-2px;  --sx:9px;  --sy:4px;  --cscale:0.62; --sscale:0.93; --rscale:0.80;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:21px; --cy:5px;   --sx:11px; --sy:10px; --cscale:0.69; --sscale:0.84; --rscale:0.85;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:17px; --cy:12px;  --sx:8px;  --sy:18px; --cscale:0.76; --sscale:0.74; --rscale:0.90;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
    </g>

    <g transform="rotate(180)">
      <g class="particle" style="--cx:18px; --cy:-8px;  --sx:5px;  --sy:0px;  --cscale:0.55; --sscale:1.00; --rscale:0.75;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:21px; --cy:-2px;  --sx:9px;  --sy:4px;  --cscale:0.62; --sscale:0.93; --rscale:0.80;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:21px; --cy:5px;   --sx:11px; --sy:10px; --cscale:0.69; --sscale:0.84; --rscale:0.85;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:17px; --cy:12px;  --sx:8px;  --sy:18px; --cscale:0.76; --sscale:0.74; --rscale:0.90;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
    </g>

    <g transform="rotate(270)">
      <g class="particle" style="--cx:18px; --cy:-8px;  --sx:5px;  --sy:0px;  --cscale:0.55; --sscale:1.00; --rscale:0.75;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:21px; --cy:-2px;  --sx:9px;  --sy:4px;  --cscale:0.62; --sscale:0.93; --rscale:0.80;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:21px; --cy:5px;   --sx:11px; --sy:10px; --cscale:0.69; --sscale:0.84; --rscale:0.85;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">1</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
      <g class="particle" style="--cx:17px; --cy:12px;  --sx:8px;  --sy:18px; --cscale:0.76; --sscale:0.74; --rscale:0.90;">
        <text class="digit" x="0" y="0" fill="#9ce8ff" font-family="monospace" font-size="5.4" text-anchor="middle" dominant-baseline="middle">0</text>
        <circle class="blob" cx="0" cy="0" r="1.7" fill="#7fe1ff"/>
      </g>
    </g>
  </g>

  <circle class="core" cx="50" cy="50" r="2.2" fill="#ffffff"/>
</svg>
